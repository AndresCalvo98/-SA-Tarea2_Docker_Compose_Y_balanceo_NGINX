events {
    worker_connections 1024;
}

http {
    # Definimos el grupo de servidores de backend (Balanceo de carga)
    # Por defecto, NGINX usa el algoritmo Round Robin, que distribuye las 
    # peticiones de forma secuencial y equitativa entre los servidores.
    upstream noticias_app {
        server web1:3000;
        server web2:3000;
        server web3:3000;
    }

    server {
        # NGINX escuchará en el puerto 80 (el puerto estándar HTTP)
        listen 80;

        # Regla de enrutamiento 1: Raíz (/) hacia la aplicación principal
        location / {
            proxy_pass http://noticias_app;
            
            # Conservar encabezados originales
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Regla de enrutamiento 2: Ejemplo de otra ruta (hacia una API específica)
        # Esto demuestra cómo enrutar ciertas URLs a destinos específicos
        location /api/ {
            proxy_pass http://noticias_app/api/;
            proxy_set_header Host $host;
        }

        # Regla de enrutamiento 3: Denegar acceso a ciertos archivos
        location ~ /\.ht {
            deny all;
        }
    }
}
